# =============================================================================
# ANS-GO 一体化部署（all-in-one 容器，KVM / 资源充足主机推荐）
#
# 一个容器内跑全部服务：caddy(:443 伪装) + sing-box(按需) + ansgo-panel
# 容器内 systemd 作 PID 1，复用裸金属的全部 unit/脚本/面板代码。
#
# host 网络 + privileged：systemd 容器需访问 cgroup；代理端口直连宿主。
# 持久卷：配置/密钥/证书/acme 状态全部在卷里，容器重建不丢失。
#
# 凭证与端口经同级 ansgo.env（600 权限，gitignore）传入，不落命令行历史。
#
# 用法（推荐经 install.sh --docker 自动生成本文件 + ansgo.env）：
#   docker compose up -d
#   docker compose logs -f ansgo
#   docker exec -it ansgo ansgo-admin status
#
# 手动首次部署需先准备 ansgo.env，至少包含：
#   DOMAIN=your-domain.com
#   DYNU_API_KEY=...                 # 路径 A（或用 DYNU_CLIENT_ID+DYNU_SECRET 路径 B）
#   PANEL_PASS=...                   # 管理员密码（仅首次生效）
#   URL_PATH=/xxxx/                  # 面板随机 URL 路径（仅首次生效）
# =============================================================================
services:
  ansgo:
    image: ghcr.io/6667084/ansgo:latest
    # 本地构建（无 ghcr 镜像时取消注释，并把 image 改为 build）：
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile.allinone
    container_name: ansgo
    restart: unless-stopped
    privileged: true          # systemd 容器需完整 cgroup 访问
    network_mode: host        # 端口直连宿主，无需端口映射
    cgroup: host
    stop_signal: SIGRTMIN+3   # systemd 优雅停机信号
    tmpfs:
      - /run:exec
      - /run/lock
    # ---- v1.5.36: 资源约束（防泄漏/失控拖垮小内存宿主，失控受 cgroup 限制，业务进程由 systemd 重启）----
    #   常驻约 50-105MiB（sing-box+caddy+panel+容器内 systemd），峰值含 acme 签发/健康检测。
    #   mem_limit     : 容器内存硬限制。install.sh 部署时按宿主内存自动收紧（≤1G 宿主取 70%），
    #                   可用 --docker-mem <MB> 覆盖；手动部署可按机器规格自行调整。
    #   memswap_limit : 内存+swap 总上限（比 mem_limit 多 256m swap 缓冲，防过早 OOM）。
    #   pids_limit    : 进程数上限（防 fork 炸弹；正常业务约 30-60 进程）。
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 512
    cpu_shares: 512
    cpus: 1.0
    # ---- v1.5.36: 容器日志限制（json-file 轮转，防长期运行日志写满小盘）----
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ansgo.env
    volumes:
      - ansgo_etc:/etc/ansgo
      - ansgo_ssl:/etc/ssl/ansgo
      - ansgo_caddy:/etc/caddy
      - ansgo_sb:/etc/sing-box
      - ansgo_acme:/root/.acme.sh
      # v1.5.32：Docker 手动证书同步目录（宿主计划任务写入，容器只读导入到 /etc/ssl/ansgo）
      - /etc/ansgo-docker/manual-certs:/host/manual-certs:ro

volumes:
  ansgo_etc:
  ansgo_ssl:
  ansgo_caddy:
  ansgo_sb:
  ansgo_acme:
