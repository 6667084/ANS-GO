<section id="login" aria-label="管理员登录">
 <div class="login-box"><div class="brand-mark" aria-hidden="true">A</div><h1>管理你的连接。</h1><p class="muted">登录 ANS-GO 控制台</p>
 <form id="loginForm" class="stack"><label class="field"><span>管理员账号</span><input id="lu" required autocomplete="username"></label><label class="field"><span>密码</span><input id="lp" type="password" required autocomplete="current-password"></label><button class="primary" type="submit" id="loginBtn">登录控制台</button><div class="error-line" id="lerr" role="alert"></div></form>
 <p class="help">忘记密码？在服务器 SSH 执行<br><code>ansgo-admin panel-pass</code> 重置。</p></div>
</section>
<div id="app" hidden>
 <aside class="sidebar" id="sidebar" aria-label="主导航"><div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">ANS-GO<small>SERVER CONSOLE</small></span></div><button class="quiet mobile-close" id="closeMenu" aria-label="关闭导航">关闭</button><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="side-footer"><button class="quiet desktop-collapse" id="collapseBtn" aria-label="折叠导航" aria-expanded="true"></button><div class="version">ANS-GO <span id="verTag">v-</span></div></div></aside>
 <div class="drawer-backdrop" id="sidebarOverlay" hidden></div>
 <div class="workspace"><header class="topbar"><div class="breadcrumb"><button id="menuBtn" class="quiet mobile-menu" aria-label="打开导航" aria-expanded="false"></button><span>工作空间 /</span><strong id="crumb">仪表盘</strong></div><div class="top-actions"><span id="topuser"></span><span id="panelDot" class="dot" role="status" aria-label="面板状态加载中" title="面板状态加载中"></span><button id="themeBtn" class="quiet" aria-label="切换明暗主题"></button><button id="logoutBtn" class="quiet">退出</button></div></header><main class="content" id="content" tabindex="-1"></main></div>
</div>

const state={tab:'dash',seq:0,authed:false,resume:false,forms:new Set(),landings:new Map(),services:new Map(),upgrading:false,upgradeTimer:null,upgradeLog:'',upgradeMessage:'尚未启动升级',dashboard:null,dashboardAt:0};
const pages={dash:['仪表盘','OVERVIEW','连接、服务与服务器状态，一目了然。','grid'],node:['节点信息','CONNECTIONS','复制连接参数，或扫描二维码导入客户端。','globe'],mgmt:['服务管理','SERVICES','每个协议独立管理。展开卡片编辑配置与凭证。','server'],landing:['落地服务','ROUTING','独立的 AnyTLS 入站与远端出口，保留每套协议配置。','route'],cert:['证书管理','CERTIFICATES','配置证书来源，管理签发、续期与宿主同步。','shield'],system:['系统维护','MAINTENANCE','版本升级、资源预算与空间清理。','tool'],set:['面板设置','PREFERENCES','配置控制台、访问安全与网络入口。','settings'],log:['运行日志','LOGS','按服务查看最近日志，定位连接与配置问题。','terminal']};

function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text??'');return n}
function icon(name){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');n.setAttribute('viewBox','0 0 24 24');n.setAttribute('aria-hidden','true');const p=document.createElementNS(n.namespaceURI,'path');p.setAttribute('d',paths[name]||paths.server);n.append(p);return n}
function button(label,fn,cls='',ico){const b=el('button',cls);b.type='button';if(ico)b.append(icon(ico));b.append(document.createTextNode(label));if(fn)b.addEventListener('click',()=>run(b,()=>fn(b)));return b}
function note(text,kind=''){return el('div','notice '+kind,text)}
function badge(text,kind=''){return el('span','badge '+kind,text)}
function help(text){return el('p','help',text)}
function stored(k,fallback){try{return localStorage.getItem(k)??fallback}catch{return fallback}}
function remember(k,v){try{localStorage.setItem(k,v)}catch{}}

function errorText(j,status){const errors=Array.isArray(j.errors)?j.errors.filter(Boolean).join('；'):'';const details=j.results?Object.values(j.results).map(x=>x.error).filter(Boolean).join('；'):'';return [j.error||errors||details||j.msg||('操作失败'+(status?'（HTTP '+status+'）':'')),j.hint].filter(Boolean).join('\n')}
async function api(path,options={}){
 const {quiet=false,dataError=false,...opts}=options;
 try{
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});
  const text=await r.text();let j;try{j=JSON.parse(text)}catch{j=null}
  if(r.status===401){showLogin(true);const e=new Error(path==='api/login'?(j?.error||'账号或密码错误'):'会话已过期，请重新登录；未保存内容暂留本页。');e.status=401;e.data=j;throw e}
  if(!j||typeof j!=='object'||Array.isArray(j))throw new Error('服务器响应无效（HTTP '+r.status+'）');
  if(!r.ok||j.ok===false||(j.error&&!dataError)||(Array.isArray(j.errors)&&j.errors.length)){const e=new Error(errorText(j,r.status));e.status=r.status;e.data=j;throw e}
  return j;
 }catch(e){if(!quiet)toast(e.message||'网络请求失败');throw e}
}
const post=(path,body={},opts={})=>api('api/'+path,{...opts,method:'POST',body:JSON.stringify(body)});
async function run(b,fn){if(b.disabled||b.dataset.busy)return;b.dataset.busy='true';b.disabled=true;b.setAttribute('aria-busy','true');try{return await fn()}catch(e){if(!e.status)toast(e.message||'操作失败')}finally{delete b.dataset.busy;b.disabled=b===state.upgradeButton&&state.upgrading;b.removeAttribute('aria-busy')}}
let fieldSequence=0;
function field(label,value='',options={}){
 const wrap=el('div','field'),input=el(options.choices?'select':'input'),caption=el('label','help',label);input.id=options.id||'field-'+(++fieldSequence);caption.htmlFor=input.id;wrap.append(caption);
 if(options.choices)for(const [v,t] of options.choices){const o=el('option','',t);o.value=v;input.append(o)}else input.type=options.type||'text';
 input.value=String(value??'');if(options.id)input.id=options.id;if(options.placeholder)input.placeholder=options.placeholder;
 if(options.type==='number'){input.min=options.min??1;input.max=options.max??65535;input.step=1}
 if(options.maxLength)input.maxLength=options.maxLength;if(options.type==='password')input.autocomplete='new-password';
 const line=el('div','field-wrap');line.append(input);wrap.append(line);if(options.help)wrap.append(help(options.help));return {wrap,input,line};
}
function randomize(f,fn){const b=button('',()=>{f.input.value=fn();f.input.dispatchEvent(new Event('input',{bubbles:true}));f.input.focus();toast('已生成随机值，保存后生效')},'quiet','dice');b.title='随机生成，不自动保存';b.setAttribute('aria-label','随机生成');f.line.append(b)}
function randString(n=20){const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',b=crypto.getRandomValues(new Uint8Array(n));return Array.from(b,x=>a[x%a.length]).join('')}
function randKey(method){const n=/aes-128/.test(method)?16:32;return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(n))))}

 '[ "$rc" = 0 ] && { echo "证书未变化，无需重载"; exit 0; }\n'+

function paintUpgrade(){const log=$('#upgradeLog'),message=$('#upgradeMessage');if(log){log.textContent=state.upgradeLog||'等待升级日志…';log.scrollTop=log.scrollHeight}if(message)message.textContent=state.upgradeMessage}
async function pollUpgrade(){
 clearTimeout(state.upgradeTimer);if(!state.upgrading||!state.authed||state.upgradePolling)return;state.upgradePolling=true;
 try{
  const j=await api('api/system/upgrade-status',{quiet:true});state.upgradeLog=j.log||state.upgradeLog;
  if(j.running){state.upgradeSeen=true;state.upgradeMessage='升级进行中；面板重启后会自动重新连接'}
  else if(['success','failed'].includes(j.result)&&(state.upgradeSeen||!state.upgradeBaseline||j.result!==state.upgradeBaseline.result||j.log!==state.upgradeBaseline.log)){state.upgrading=false;state.upgradeSeen=false;state.upgradeBaseline=null;state.upgradeMessage=j.result==='success'?'升级成功，已重新连接面板':'升级失败，请查看日志与回滚结果';if(state.upgradeButton?.isConnected)state.upgradeButton.disabled=false;toast(state.upgradeMessage);if(j.result==='success'){state.dashboard=null;const a=await api('api/auth',{quiet:true});if(!a.authed){showLogin(true);return}$('#verTag').textContent='v'+String(a.version||'-').replace(/^v/,'');if(state.tab==='system'){const seq=state.seq,fresh=await api('api/system/info',{quiet:true});if(seq===state.seq){const p=$('#content').querySelector('[data-fold="system.resources"]');if(p){p.querySelector('.panel-body').replaceChildren(systemResources(fresh));const sub=p.querySelector('small');if(sub)sub.textContent=fresh.version+' · 升级后已重新连接'}}}}}
  else state.upgradeMessage='等待升级任务启动…';
 }catch(e){state.upgradeMessage=e.status===401?'面板已恢复，请登录后继续查看进度':'面板暂时离线，正在自动重连…'}
 finally{state.upgradePolling=false;paintUpgrade();if(state.upgrading&&state.authed){if(Date.now()-(state.upgradeStarted||0)>20*60*1000){state.upgrading=false;state.upgradeMessage='等待超过 20 分钟，请重新进入维护页核实升级状态';if(state.upgradeButton?.isConnected)state.upgradeButton.disabled=false;paintUpgrade()}else state.upgradeTimer=setTimeout(pollUpgrade,2000)}}
}
